<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 - Page Not Found | AI Portfolio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@500&family=Inter:wght@400;600&family=Poppins:wght@700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/style.css">
  <style>
    .error-container {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 2rem;
    }
    .error-code {
      font-family: var(--font-heading);
      font-size: 8rem;
      font-weight: 800;
      line-height: 1;
      margin-bottom: 1rem;
    }
  </style>
</head>
<body>
  <div class="error-container">
    <div class="glass-card" style="max-width: 500px; padding: 3rem;">
      <div class="error-code gradient-text">404</div>
      <h1 style="font-size: 1.8rem; margin-bottom: 1rem;">Neural Node Not Found</h1>
      <p style="color: var(--text-secondary); margin-bottom: 2rem;">
        The page or dataset parameter you are searching for does not exist or has been moved to another location.
      </p>
      <a href="index.html" class="btn btn-primary">
        <i class="fas fa-home"></i> Back to Safety (Home)
      </a>
    </div>
  </div>
</body>
</html>
